services:
  - type: web
    name: napne-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./napne.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://napne-digital.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: PYTHON_VERSION
        value: "3.12.0"
